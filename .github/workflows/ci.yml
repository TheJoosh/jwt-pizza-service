name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.29
        env:
          MYSQL_ROOT_PASSWORD: tempdbpassword
          MYSQL_DATABASE: pizza
        ports:
          - '3306:3306'
        options: >-
          --health-cmd "mysqladmin ping -ptempdbpassword" --health-interval 10s --health-start-period 10s --health-timeout 5s --health-retries 10
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
 
      - name: Write config file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          METRICS_ENDPOINT_URL: ${{ secrets.METRICS_ENDPOINT_URL }}
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
          METRICS_ACCOUNT_ID: ${{ secrets.METRICS_ACCOUNT_ID }}
          LOGGING_ENDPOINT_URL: ${{ secrets.LOGGING_ENDPOINT_URL }}
          LOGGING_API_KEY: ${{ secrets.LOGGING_API_KEY }}
          LOGGING_ACCOUNT_ID: ${{ secrets.LOGGING_ACCOUNT_ID }}
        run: |
          node -e "const fs = require('fs'); const config = { jwtSecret: process.env.JWT_SECRET, db: { connection: { host: '127.0.0.1', user: 'root', password: 'tempdbpassword', database: 'pizza', connectTimeout: 60000 }, listPerPage: 10 }, factory: { url: 'https://pizza-factory.cs329.click', apiKey: process.env.FACTORY_API_KEY }, metrics: { enabled: true, source: 'jwt-pizza-service', endpointUrl: process.env.METRICS_ENDPOINT_URL, apiKey: process.env.METRICS_API_KEY, accountId: process.env.METRICS_ACCOUNT_ID }, logging: { source: 'jwt-pizza-service', endpointUrl: process.env.LOGGING_ENDPOINT_URL, apiKey: process.env.LOGGING_API_KEY, accountId: process.env.LOGGING_ACCOUNT_ID } }; fs.writeFileSync('src/config.js', 'module.exports = ' + JSON.stringify(config, null, 2) + ';\\n');"
      - name: Tests
        run: npm test

      - name: Create dist
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
        run: |
          mkdir dist
          cp Dockerfile dist
          cp -r src/* dist
          cp *.json dist
          node -e "const fs = require('fs'); const path = 'dist/config.js'; const config = require('./dist/config.js'); config.db.connection.user = process.env.DB_USERNAME; config.db.connection.password = process.env.DB_PASSWORD; config.db.connection.host = process.env.DB_HOSTNAME; fs.writeFileSync(path, 'module.exports = ' + JSON.stringify(config, null, 2) + ';\\n');"

      - name: Update distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/
      
      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > src/version.json

      - name: Update coverage
        run: |
          coverage=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          color=$(echo "$coverage < 80" | bc | awk '{if ($1) print "red"; else print "green"}')
          curl -s -X POST "https://pizza-factory.cs329.click/api/badge/${{ secrets.NET_ID }}/jwtpizzaservicecoverage?label=Coverage&value=$coverage%25&color=$color" -H "authorization: bearer ${{ secrets.FACTORY_API_KEY }}"
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: build
    env:
      version: ${{needs.build.outputs.version}}
    steps:
    
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up machine emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: 'jwt-pizza-service'
        run: |
          docker build --platform=linux/arm64 -t $ECR_REGISTRY/$ECR_REPOSITORY --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >>  $GITHUB_OUTPUT

      - name: Deploy new container
        run: |
          aws ecs update-service --cluster jwt-pizza-service --service jwt-pizza-service --force-new-deployment
      
      - name: Annotate deployment in Grafana
        run: |
          curl -s -X POST https://niftyporch3174.grafana.net/api/annotations \
          -H "Authorization: Bearer ${{ secrets.GRAFANA_ACCESS_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"dashboardUID":"thfm8sf", "panelId":1, "tags":["backend","production"], "text":"Version '"$version"' deployed" }'
  
